name: FlovexCore
version: '1.0.7'
main: net.flovex.core.FlovexCore
api-version: '26.2'
authors: [Flovex]
description: FlovexSMP player, marketplace and moderation core.
softdepend: [LuckPerms, Vault, ExcellentEconomy, PlaceholderAPI, floodgate, Geyser-Spigot, LibsDisguises]
libraries:
  - org.xerial:sqlite-jdbc:3.50.3.0
commands:
  rtp: {description: Open the three-world random teleport dialog}
  rtpq: {description: Join or leave the random teleport queue}
  shop: {description: Open the Quick Buy shop}
  shardshop: {description: Open the Shard Shop}
  shards: {description: View shard balance}
  shardpay: {description: Pay shards to another player}
  addshards: {description: Add shards to a player}
  removeshards: {description: Remove shards from a player}
  setshards: {description: Set a player's shard balance}
  sell: {description: Open the sell inventory}
  sellhand: {description: Sell the item in your hand}
  sellall: {description: Sell all sellable inventory items}
  sellhistory: {description: View your recent sales}
  topsell: {description: View top sellers}
  worth: {description: Check shop and sell prices}
  menu: {description: Open the FlovexCore menu}
  auctionhouse: {description: Auction House, aliases: [ah]}
  orders: {description: Player buy orders}
  tpa: {description: Request teleport}
  tpahere: {description: Request player teleport}
  tpaccept: {description: Accept teleport}
  tpadeny: {description: Deny teleport}
  tpacancel: {description: Cancel teleport}
  tpauto: {description: Toggle TPA auto}
  tpahereauto: {description: Toggle TPAHere auto}
  msg: {description: Private message, aliases: [message, tell, w]}
  reply: {description: Reply, aliases: [r]}
  pm: {description: Toggle private messages}
  ignore: {description: Ignore player}
  unignore: {description: Unignore player}
  friends: {description: Manage friends, aliases: [friend]}
  profile: {description: Player profile, aliases: [profileviewer]}
  stats: {description: Player stats}
  playtime: {description: Playtime, aliases: [pt]}
  ping: {description: Ping}
  bounty: {description: Item bounties}
  leaderboard: {description: Leaderboards, aliases: [top]}
  scoreboard: {description: Toggle scoreboard, aliases: [sb]}
  settings: {description: Player settings}
  report: {description: Report a player}
  reports: {description: Staff report queue}
  chatlog: {description: Review chat logs}
  chat: {description: Chat moderation}
  freeze: {description: Freeze a player}
  staffmode: {description: Toggle staff mode}
  stafflist: {description: Online staff}
  staffchat: {description: Staff chat}
  helpop: {description: Contact staff}
  punishments: {description: Punishment history}
  warn: {description: Warn player}
  kick: {description: Kick player}
  ban: {description: Ban player}
  tempban: {description: Temporary ban}
  unban: {description: Unban player}
  mute: {description: Mute player}
  tempmute: {description: Temporary mute}
  unmute: {description: Unmute player}
  fly: {description: Toggle flight}
  flyspeed: {description: Set flight speed}
  heal: {description: Heal player}
  feed: {description: Feed player}
  gamemode: {description: Change gamemode, aliases: [gm]}
  vanish: {description: Toggle vanish}
  invsee: {description: Inspect inventory}
  teleport: {description: Teleport player, aliases: [tp]}
  findplayer: {description: Find player}
  nightvision: {description: Night vision}
  god: {description: God mode}
  team: {description: Team management}
  warp: {description: Teleport to a warp}
  warps: {description: List warps}
  setwarp: {description: Create or update a warp}
  delwarp: {description: Delete a warp}
  hide: {description: Hide or show other players}
  rules: {description: View server rules}
  help: {description: View FlovexCore help}
  ranks: {description: View rank information}
  rename: {description: Rename held item}
  clearlag: {description: Clear dropped items}
  logs: {description: View player logs}
  blacklist: {description: Blacklist a player}
  unblacklist: {description: Remove a player blacklist}
  offend: {description: Record a player offense}
  servers: {description: View network server information}
  disguise: {description: Disguise using optional disguise integration}
  kill: {description: Kill yourself or a player}
  safety: {description: Toggle PvP safety}
  phantom: {description: Toggle phantom spawning near you}
  spawner: {description: Inspect or configure a spawner}
  cuboid: {description: Select and inspect cuboid regions}
  voicechatconsent: {description: Toggle voice chat consent}
  warpmanager: {description: Manage warps}
  portalmanager: {description: Manage server portals}
permissions:
  flovexcore.admin: {default: op}
  flovexcore.staff: {default: op}
  flovexcore.market.use: {default: true}
  flovexcore.shop.use: {default: true}
  flovexcore.shards.use: {default: true}
  flovexcore.shards.admin: {default: op}
  flovexcore.sell.use: {default: true}
  flovexcore.rtp.queue: {default: true}
  flovexcore.settings.use: {default: true}
  flovexcore.market.admin: {default: op}
  flovexcore.teleport.use: {default: true}
  flovexcore.social.use: {default: true}
  flovexcore.pvp.use: {default: true}
  flovexcore.moderation.use: {default: op}
  flovexcore.staffmode: {default: op}
