name: Build FlovexCore
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: FlovexCore-1.0.8
          path: target/FlovexCore-1.0.7.jar
          if-no-files-found: error