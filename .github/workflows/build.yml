name: Build FlovexMarket
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: FlovexMarket-1.0.0
          path: target/FlovexMarket-1.0.0.jar
          if-no-files-found: error
